name: Prepare approved update-check branch
on:
  push:
    branches: [feat/update-check]
permissions:
  contents: write
jobs:
  prepare:
    if: contains(github.event.head_commit.message, 'prepare approved update checker')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          git config user.name "laresbernardo"
          git config user.email "laresbernardo@users.noreply.github.com"
      - name: Apply reviewed files and remove bootstrap
        shell: python
        run: |
          import base64, hashlib, pathlib, subprocess
          payload = {'.github/workflows/deploy.yml': '', 'PinmageApp/Info.plist': '', 'PinmageApp/PinmageApp.swift': '', 'PinmageApp/Views/MainView.swift': '', 'README.md': '', 'firebase.json': '', 'install.sh': '', 'website/version.json': '', 'PinmageApp/UpdateManifest.swift': '', 'PinmageApp/UpdateChecker.swift': '', 'PinmageApp/Views/UpdateNoticeView.swift': '', 'Tests/UpdateManifestTests.swift': '', 'scripts/stamp-release.py': ''}
          for name, encoded in payload.items():
              path = pathlib.Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(encoded))
              assert path.read_bytes() == base64.b64decode(encoded)
          pathlib.Path('.github/workflows/prepare-update.yml').unlink()
          subprocess.run(['git', 'add', '-A'], check=True)
          subprocess.run(['git', 'commit', '-m', 'feat: add lightweight free update checks'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:feat/update-check'], check=True)
